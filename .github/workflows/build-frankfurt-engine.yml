name: Build Frankfurt Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Engine/FrankfurtEngine/**"
      - ".github/workflows/build-frankfurt-engine.yml"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git xorg-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S Engine/FrankfurtEngine -B Engine/FrankfurtEngine/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Engine/FrankfurtEngine/build --config Release --parallel 2

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Frankfurt-Engine-Linux
          path: Engine/FrankfurtEngine/build/frankfurt_engine
          if-no-files-found: error
          retention-days: 14
