name: Build Frankfurt Life for Windows

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'game.html'
      - 'game.css'
      - 'style.css'
      - 'script.js'
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/windows-build.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --input-type=module --check < script.js
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable app
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Frankfurt-Life-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish stable beta downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Frankfurt Life Beta
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
