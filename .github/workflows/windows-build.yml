name: Build Frankfurt Life for Windows

# Only the newest commit should package and publish the shared beta release.
concurrency:
  group: frankfurt-life-windows-${{ github.ref }}
  cancel-in-progress: true

# Packages the modern and San Andreas editions after game-code or asset-catalog changes.

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'launcher.html'
      - 'launcher.css'
      - 'launcher.js'
      - 'titan-engine.yml'
      - 'studio.html'
      - 'studio.css'
      - 'studio.js'
      - 'electron/main-studio.cjs'
      - 'game.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'electron-builder-legacy.yml'
      - 'game.css'
      - 'style.css'
      - 'script.js'
      - 'scripts/fetch-3d-assets.mjs'
      - 'package.json'
      - 'electron/**'
      - 'electron-builder-action.yml'
      - 'electron-builder-classic.yml'
      - 'Unreal/Realistic/ArtSource/vehicle_specs.json'
      - '.github/workflows/windows-build.yml'

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and validate bundled CC0 3D models
        run: node scripts/fetch-3d-assets.mjs
      - name: Check JavaScript syntax
        run: Get-Content -Raw script.js | node --input-type=module --check
      - name: Check launcher and Electron syntax
        run: |
          node --check launcher.js
          node --check electron/main.cjs
          node --check electron/main-classic.cjs
          node --check electron/main-legacy.cjs
          node --check electron/main-action.cjs
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable app
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build separate Action Edition
        run: npx electron-builder --config electron-builder-action.yml --win nsis portable --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build standalone Titan Engine Studio
        run: npm run dist:engine
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build separate San Andreas retro-3D edition
        run: npm run dist:classic
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Build legacy laptop edition
        run: npm run dist:legacy
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Frankfurt-Life-Windows-x64
          path: |
            dist/*
            dist-action/*
            dist-legacy/*
            dist-sanandreas/*
            dist-engine/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish stable beta downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Frankfurt Life Beta
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/*.exe
            dist-action/*.exe
            dist-legacy/*.exe
            dist-sanandreas/*.exe
            dist-engine/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
