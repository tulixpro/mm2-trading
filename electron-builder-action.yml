appId: de.frankfurtlife.action
productName: Frankfurt Life Action
directories:
  output: dist-action
files:
  - launcher.html
  - launcher.css
  - launcher.js
  - game.html
  - game.css
  - index.html
  - style.css
  - script.js
  - electron/**/*
  - assets/**/*
extraMetadata:
  main: electron/main-action.cjs
  version: 0.4.8
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
