appId: de.frankfurtlife.sanandreas
productName: Frankfurt Life San Andreas
directories:
  output: dist-sanandreas
files:
  - launcher.html
  - launcher.css
  - launcher.js
  - game.html
  - game.css
  - script.js
  - electron/main-classic.cjs
  - assets/**/*
  - node_modules/three/**/*
extraMetadata:
  main: electron/main-classic.cjs
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
