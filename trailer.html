<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111c">
<title>Frankfurt Life – Gameplay Trailer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#f4f5ef;font-family:Arial,sans-serif}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
.shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,#02071166 0%,transparent 18%,transparent 72%,#02071199 100%)}
.brand{position:absolute;z-index:4;top:24px;left:28px;font-size:11px;font-weight:900;letter-spacing:.25em;color:#8bdcff;text-shadow:0 2px 12px #000;pointer-events:none}
.controls{position:absolute;z-index:5;right:22px;bottom:20px;display:flex;gap:9px;align-items:center}
button{border:1px solid #ffffff77;border-radius:4px;background:#071626e8;color:white;padding:11px 14px;font-weight:900;letter-spacing:.04em;cursor:pointer}
button.primary{background:#67c9fa;color:#061522;border-color:#67c9fa}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.live{position:absolute;z-index:4;left:28px;bottom:26px;font-size:10px;letter-spacing:.16em;color:#dbe7ec;text-shadow:0 2px 8px #000;pointer-events:none}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#65e5a3;margin-right:8px;box-shadow:0 0 12px #65e5a3}
#startScreen{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,#193955 0%,#091522 68%,#050b13 100%);text-align:center}
.start-card{max-width:560px}
.eyebrow{color:#80d8ff;font-size:10px;font-weight:900;letter-spacing:.24em}
h1{font-size:clamp(38px,8vw,76px);line-height:.9;letter-spacing:-.05em;margin:18px 0}
h1 em{font-style:normal;color:#80d8ff}
p{color:#c3d2df;line-height:1.6;font-size:14px}
#start{margin-top:16px;padding:16px 24px;font-size:13px}
#loading{display:none;position:absolute;z-index:9;inset:0;place-items:center;background:#07111c;color:#dbe7ec;font-weight:800;letter-spacing:.12em}
@media(max-width:600px){.brand{left:14px;top:14px;font-size:9px}.controls{right:10px;bottom:10px;gap:6px}.controls button{padding:9px;font-size:10px}.live{left:14px;bottom:18px;font-size:8px}}
</style>
</head>
<body>
<div id="startScreen"><div class="start-card"><div class="eyebrow">FRANKFURT LIFE · LIVE GAMEPLAY</div><h1>DEINE STADT.<br><em>DEIN TRAILER.</em></h1><p>Starte die echte 3D-Spielwelt. Du spielst direkt das richtige Frankfurt-Life-Game mit normaler Steuerung – kein Cinematic-Modus.</p><button id="start" class="primary">▶ TRAILER STARTEN</button></div></div>
<div id="loading">3D-SPIELWELT WIRD GELADEN …</div>
<iframe id="game" title="Frankfurt Life – echte 3D-Spielwelt" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<div class="shade"></div><div class="brand">FRANKFURT LIFE · GAMEPLAY TRAILER</div>
<div class="live"><i></i>ECHTES GAMEPLAY · DU HAST DIE KONTROLLE</div>
<div class="controls"><button id="sound" class="primary" disabled>♫ MUSIK STARTEN</button><button id="replay" disabled>↻ NEU STARTEN</button><button id="fullscreen">⛶ VOLLBILD</button></div>
<script>
const game=document.getElementById('game');
const startScreen=document.getElementById('startScreen');
const loading=document.getElementById('loading');
const sound=document.getElementById('sound');
const replay=document.getElementById('replay');
let audioOn=false,started=false;
function launch(){
 if(started)return;
 started=true;
 startScreen.style.display='none';
 loading.style.display='grid';
 game.src='game.html?play=1&take='+Date.now();
}
function sendAudio(){
 if(audioOn&&game.contentWindow)game.contentWindow.postMessage('fl-start-trailer-audio',location.origin);
}
game.addEventListener('load',()=>{
 if(!started)return;
 loading.style.display='none';
 sound.disabled=false;replay.disabled=false;
 sendAudio();
});
document.getElementById('start').addEventListener('click',launch);
sound.addEventListener('click',()=>{
 audioOn=!audioOn;
 game.contentWindow?.postMessage(audioOn?'fl-start-trailer-audio':'fl-stop-trailer-audio',location.origin);
 sound.textContent=audioOn?'♫ MUSIK AN':'♫ MUSIK STARTEN';
});
replay.addEventListener('click',()=>{
 loading.style.display='grid';sound.disabled=true;replay.disabled=true;audioOn=false;sound.textContent='♫ MUSIK STARTEN';
 game.src='game.html?play=1&take='+Date.now();
});
document.getElementById('fullscreen').addEventListener('click',()=>{
 document.documentElement.requestFullscreen?.();
});
</script>
</body>
</html>
