<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frankfurt Life – Gameplay Trailer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#f4f5ef;font-family:Arial,sans-serif}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#02071188 0%,transparent 18%,transparent 72%,#02071199 100%)}
.brand{position:absolute;z-index:3;top:24px;left:28px;font-size:11px;font-weight:900;letter-spacing:.25em;color:#8bdcff;text-shadow:0 2px 12px #000;pointer-events:none}
.controls{position:absolute;z-index:5;right:22px;bottom:20px;display:flex;gap:9px;align-items:center}
button{border:1px solid #ffffff77;border-radius:4px;background:#071626dd;color:white;padding:11px 14px;font-weight:900;letter-spacing:.04em;cursor:pointer}
button.primary{background:#67c9fa;color:#061522;border-color:#67c9fa}
.live{position:absolute;z-index:3;left:28px;bottom:26px;font-size:10px;letter-spacing:.16em;color:#dbe7ec;text-shadow:0 2px 8px #000;pointer-events:none}
.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#65e5a3;margin-right:8px;box-shadow:0 0 12px #65e5a3}
@media(max-width:600px){.brand{left:14px;top:14px;font-size:9px}.controls{right:10px;bottom:10px;gap:6px}.controls button{padding:9px;font-size:10px}.live{left:14px;bottom:18px;font-size:8px}}
</style></head><body>
<iframe id="game" src="game.html?trailer=1" title="Frankfurt Life – echte 3D-Spielwelt"></iframe>
<div class="shade"></div><div class="brand">FRANKFURT LIFE · GAMEPLAY TRAILER</div>
<div class="live"><i></i>ECHTE SPIELWELT · LIVE GERENDERT</div>
<div class="controls"><button id="sound" class="primary">♫ MUSIK STARTEN</button><button id="replay">↻ NEU STARTEN</button><button id="fullscreen">⛶ VOLLBILD</button></div>
<script>
const game=document.getElementById('game'),sound=document.getElementById('sound');let audioOn=false;
function sendAudio(){if(audioOn)game.contentWindow.postMessage('fl-start-trailer-audio','*');}
game.addEventListener('load',()=>setTimeout(sendAudio,900));
sound.addEventListener('click',()=>{audioOn=!audioOn;game.contentWindow.postMessage(audioOn?'fl-start-trailer-audio':'fl-stop-trailer-audio','*');sound.textContent=audioOn?'♫ MUSIK AN':'♫ MUSIK STARTEN';});
document.getElementById('replay').addEventListener('click',()=>{game.src='game.html?trailer=1&take='+Date.now();});
document.getElementById('fullscreen').addEventListener('click',()=>{document.documentElement.requestFullscreen?.();});
</script></body></html>
